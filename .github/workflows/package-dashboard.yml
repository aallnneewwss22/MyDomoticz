name: Package dashboard for Raspberry Pi

on:
  pull_request:
    branches:
      - main
    paths:
      - "dashboard/**"
      - ".github/workflows/package-dashboard.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package-dashboard:
    name: Build deployment ZIP
    runs-on: ubuntu-latest
    steps:
      - name: Checkout pull request
        uses: actions/checkout@v4

      - name: Prepare deployment files
        shell: bash
        run: |
          set -euo pipefail

          # Select the newest versioned launcher and resolve its matching dashboard.
          launcher_file="$(find dashboard -maxdepth 1 -type f -name 'maison-v*.html' -printf '%f\n' | sort -V | tail -n 1)"
          if [[ -z "${launcher_file}" ]]; then
            echo "No versioned dashboard launcher was found." >&2
            exit 1
          fi
          dashboard_file="$(grep -oE 'maison-dashboard-v[0-9]+\.html' "dashboard/${launcher_file}" | head -n 1)"
          if [[ -z "${dashboard_file}" ]]; then
            echo "Could not determine the versioned dashboard filename from dashboard/${launcher_file}" >&2
            exit 1
          fi
          if [[ ! -f "dashboard/${dashboard_file}" ]]; then
            echo "Launcher references dashboard/${dashboard_file}, but that file does not exist." >&2
            exit 1
          fi

          mkdir -p package
          cp "dashboard/${launcher_file}" "package/${launcher_file}"
          cp "dashboard/${dashboard_file}" "package/${dashboard_file}"

          cat > package/LISEZ-MOI.txt <<EOF
          Déploiement du tableau de bord MyDomoticz
          
          Copiez ${launcher_file} et ${dashboard_file} dans :
          /home/pi/domoticz/www/templates
          
          Les deux fichiers doivent être copiés ensemble. Le lanceur ${launcher_file}
          ouvre ${dashboard_file}. Vous pouvez conserver les anciennes versions.
          
          Ce ZIP contient les fichiers HTML du tableau de bord uniquement.
          Les classeurs IDX2.xlsx et IDX1.xlsx ne sont pas inclus ; conservez-les dans
          le répertoire templates s'il est utilisé par votre installation.
          EOF

          (cd package && zip -r ../maison-dashboard-raspberry-pi.zip .)

      - name: Validate dashboard JavaScript
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          launchers = sorted(Path("dashboard").glob("maison-v*.html"), key=lambda p: [int(part) if part.isdigit() else part for part in re.split(r"(\d+)", p.name)])
          if not launchers:
              raise SystemExit("No versioned dashboard launcher was found.")
          launcher = launchers[-1].read_text(encoding="utf-8")
          match = re.search(r"maison-dashboard-v[0-9]+\.html", launcher)
          if not match:
              raise SystemExit("Could not find a versioned dashboard filename in dashboard/${launcher_file}")
          html = Path("dashboard", match.group(0)).read_text(encoding="utf-8")
          scripts = re.findall(r"<script\b[^>]*>(.*?)</script\s*>", html, re.IGNORECASE | re.DOTALL)
          inline = [script for script in scripts if script.strip()]
          if len(inline) != 1:
              raise SystemExit(f"Expected one inline dashboard script, found {len(inline)}")
          Path("/tmp/maison-dashboard.js").write_text(inline[0], encoding="utf-8")
          PY
          node --check /tmp/maison-dashboard.js

      - name: Upload deployment ZIP
        uses: actions/upload-artifact@v4
        with:
          name: maison-dashboard-raspberry-pi
          path: maison-dashboard-raspberry-pi.zip
          if-no-files-found: error
          retention-days: 14
