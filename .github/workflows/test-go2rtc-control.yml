name: Test go2rtc control service

on:
  pull_request:
    branches:
      - main
    paths:
      - "service/go2rtc-control/**"
      - ".github/workflows/test-go2rtc-control.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependency
        run: python -m pip install PyYAML
      - name: Check Python syntax
        run: python -m py_compile service/go2rtc-control/server.py service/go2rtc-control/tests/test_config.py
      - name: Check installer syntax
        run: bash -n service/go2rtc-control/install.sh
      - name: Run unit tests
        run: python -m unittest discover -s service/go2rtc-control/tests -v
